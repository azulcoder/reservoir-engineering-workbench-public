# Development environment lock for reservoir-performance-lab.
#
# This is a record of a resolved install, not a hand-maintained wish list. It was
# produced by creating .venv with the interpreter recorded below, installing
#     hatchling>=1.21 build pytest>=8.0 pytest-cov>=5.0 ruff>=0.6 mypy>=1.11
# and freezing what the resolver actually chose:
#     python3 -m venv .venv
#     .venv/bin/python -m pip install hatchling build pytest pytest-cov ruff mypy
#     .venv/bin/python -m pip freeze --exclude-editable > requirements-dev.lock
#
# Resolved on 2026-09-13 with CPython 3.13.2 on macOS (darwin, arm64), pip 26.2.1.
# mpmath was added on 2026-09-15 for case B1. It is a test oracle only: an
# independently written arbitrary-precision implementation of the exponential
# integral, used to check this project's own. BSD licensed, compatible with MIT.
# It is a development pin and is deliberately not a runtime dependency, so the
# library keeps the property of installing with nothing behind it.
#
# It pins the development toolchain only. The library itself has no runtime
# dependencies and is not pinned by anything here: see the empty `dependencies` list in
# pyproject.toml, which a test enforces by walking the import graph under src/.
#
# Reproduce the environment with:
#     python3 -m venv .venv
#     .venv/bin/python -m pip install -r requirements-dev.lock
#
# These are not hashes and this is not a cross-platform lock. It records what one
# resolution produced on one platform, which is enough to reproduce a run and to notice
# when a tool changed under the project, and it does not claim more than that.
