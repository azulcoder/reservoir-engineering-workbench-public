<!doctype html>
<meta charset="utf-8">
<title>Tab ring control fixture</title>
<!--
  One link and one button. An engine that reaches the button and never the link is
  applying the platform's "tab highlights every item" setting, which is a property of the
  environment and not of any page.
-->
<style>body { margin: 0; font: 16px system-ui, sans-serif; }</style>
<a id="control-link" href="#control-button">A control link</a>
<button id="control-button" type="button">A control button</button>
