<svg xmlns="http://www.w3.org/2000/svg" aria-describedby="desc-f02-the-residual-structure-that-would-have-had-to-give-it-away" aria-label="F02 — the residual structure that would have had to give it away" role="img" viewBox="0 0 1000 732" height="732" style="color:#14181c" width="1000"><desc id="desc-f02-the-residual-structure-that-would-have-had-to-give-it-away">Residuals of the volumetric straight-line fit for the base-case scenario, in psia of p/Z, against cumulative gas produced, with a zero rule and two neutral reference bands at plus or minus 10 and plus or minus 50 psia. The residuals are not scattered: they start at plus 24.63 psia at zero cumulative production, sweep down to about -9.59 psia, rise back through zero and fall again, an RMS of 7.38 psia over the 49 points. Nothing is smoothed and no point is omitted. Full values in the data table below the figure.</desc><rect height="732" fill="#ffffff" width="1000" y="0" x="0" /><text font-variant-numeric="tabular-nums" text-anchor="start" fill="#14181c" font-weight="600" font-family="-apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, Roboto, &quot;Helvetica Neue&quot;, Arial,
    &quot;Noto Sans&quot;, sans-serif, &quot;Apple Color Emoji&quot;, &quot;Segoe UI Emoji&quot;" font-size="17px" y="30" x="28">F02 — the residual structure that would have had to give it away</text><text font-variant-numeric="tabular-nums" text-anchor="start" fill="#5b646d" font-weight="400" font-family="-apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, Roboto, &quot;Helvetica Neue&quot;, Arial,
    &quot;Noto Sans&quot;, sans-serif, &quot;Apple Color Emoji&quot;, &quot;Segoe UI Emoji&quot;" font-size="13px" y="56" x="28">All 49 observation-minus-fit residuals for the base case, same x-scale as F01. RMS 7.38 psia, largest absolute residual 24.63 psia, which is 0.57</text><text font-variant-numeric="tabular-nums" text-anchor="start" fill="#5b646d" font-weight="400" font-family="-apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, Roboto, &quot;Helvetica Neue&quot;, Arial,
    &quot;Noto Sans&quot;, sans-serif, &quot;Apple Color Emoji&quot;, &quot;Segoe UI Emoji&quot;" font-size="13px" y="74" x="28">percent of the initial p/Z.</text><g><line stroke-width="1.5" stroke="#17518f" y2="108" x2="62" y1="108" x1="28" /><circle fill="#17518f" r="4" cy="108" cx="45" /><text font-variant-numeric="tabular-nums" text-anchor="start" fill="#434c55" font-weight="400" font-family="-apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, Roboto, &quot;Helvetica Neue&quot;, Arial,
