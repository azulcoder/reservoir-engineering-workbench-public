.402,186.419L323.742,183.759L332.082,181.148L340.422,178.624L348.762,176.224L357.102,173.984L365.443,171.941L373.783,170.128L382.123,168.581L390.463,167.333L398.803,166.419L407.143,165.872L415.484,165.725L423.824,166.011L432.164,166.762L440.504,168.012L448.844,169.794L457.184,172.139L465.525,175.081L473.865,178.654L482.205,182.889L490.545,187.82L498.885,193.482" /></g><g fill="#17518f"><circle r="3.4" cy="114.07686569821676" cx="98.55737704918033" /><circle r="3.4" cy="128.911840627115" cx="106.89754098360656" /><circle r="3.4" cy="142.07967846181919" cx="115.23770491803279" /><circle r="3.4" cy="153.699511720114" cx="123.57786885245902" /><circle r="3.4" cy="163.8827656295964" cx="131.91803278688525" /><circle r="3.4" cy="172.73387426677914" cx="140.2581967213115" /><circle r="3.4" cy="180.350917718547" cx="148.59836065573774" /><circle r="3.4" cy="186.82619060138984" cx="156.93852459016395" /><circle r="3.4" cy="192.24671075302453" cx="165.27868852459017" /><circle r="3.4" cy="196.69467561215362" cx="173.61885245901644" /><circle r="3.4" cy="200.24787274350328" cx="181.95901639344265" /><circle r="3.4" cy="202.98005004254992" cx="190.2991803278689" /><circle r="3.4" cy="204.96125041509228" cx="198.6393442622951" /><circle r="3.4" cy="206.25811505539951" cx="206.97950819672133" /><circle r="3.4" cy="206.93415893978272" cx="215.3196721311476" /><circle r="3.4" cy="207.05002164757252" cx="223.65983606557384" /><circle r="3.4" cy="206.6636962733049" cx="232.00000000000003" /><circle r="3.4" cy="205.83073876217475" cx="240.34016393442624" /><circle r="3.4" cy="204.6044598770561" cx="248.6803278688524" /><circle r="3.4" cy="203.03610154637704" cx="257.02049180327856" /><circle r="3.4" cy="201.17499930770742" cx="265.3606557377048" /><circle r="3.4" cy="199.0687322081946" cx="273.700819672131" /><circle r="3.4" cy="196.76326162059388" cx="282.0409836065572" /><circle r="3.4" cy="194.30305987153827" cx="290.38114754098336" /><circle r="3.4" cy="191.73122995343593" cx="298.72131147540955" /><circle r="3.4" cy="189.0896170502305" cx="307.06147540983574" /><circle r="3.4" cy="186.41891285489828" cx="315.401639344262" /><circle r="3.4" cy="183.75875325243985" cx="323.74180327868805" /><circle r="3.4" cy="181.1478102564507" cx="332.08196721311435" /><circle r="3.4" cy="178.6238785174191" cx="340.4221311475405" /><circle r="3.4" cy="176.22395729019536" cx="348.7622950819667" /><circle r="3.4" cy="173.98432810935026" cx="357.1024590163929" /><circle r="3.4" cy="171.940628732733" cx="365.4426229508191" /><circle r="3.4" cy="170.12792379489719" cx="373.7827868852453" /><circle r="3.4" cy="168.58077255916044" cx="382.1229508196714" /><circle r="3.4" cy="167.33329409532382" cx="390.46311475409766" /><circle r="3.4" cy="166.4192302996259" cx="398.80327868852385" /><circle r="3.4" cy="165.87200701418556" cx="407.14344262295003" /><circle r="3.4" cy="165.72479361068974" cx="415.4836065573762" /><circle r="3.4" cy="166.0105612982295" cx="423.82377049180246" /><circle r="3.4" cy="166.7621404555842" cx="432.16393442622865" /><circle r="3.4" cy="168.0122772601631" cx="440.50409836065484" /><circle r="3.4" cy="169.79368988439995" cx="448.844262295081" /><circle r="3.4" cy="172.13912452164067" cx="457.18442622950727" /><circle r="3.4" cy="175.08141152678434" cx="465.52459016393345" /><circle r="3.4" cy="178.65352188055647" cx="473.8647540983596" /><circle r="3.4" cy="182.88862432603938" cx="482.2049180327858" /><circle r="3.4" cy="187.82014340530554" cx="490.545081967212" /><circle r="3.4" cy="193.48181865059087" cx="498.8852459016382" /></g><g transform="translate(8,-2)" font-size="13" text-anchor="start" fill="#5b646d"><text transform="translate(513.4426229508185,45.16666666666668)" y="0.32em">±50 psia</text></g><g transform="translate(8,-2)" font-size="13" text-anchor="start" fill="#5b646d"><text transform="translate(513.4426229508185,153.83333333333331)" y="0.32em">±10 psia</text></g><g transform="translate(8,0)" font-size="13" text-anchor="start" fill="#5b646d"><text transform="translate(513.4426229508185,94.06666666666665)"><tspan y="-0.18em" x="0">the two bands are the case author's engineering judgement of volume-</tspan><tspan dy="1em" x="0">averaged reservoir pressure accuracy, 10 to 50 psi — not a retrieved figure</tspan></text></g><g transform="translate(10,-6)" font-size="13" text-anchor="start" fill="#17518f"><text transform="translate(98.55737704918033,114.07686569821676)" y="0.32em">largest excursion +24.63 psia at 0 Bscf</text></g><g transform="translate(-8,0)" font-size="13" text-anchor="end" fill="#434c55"><text transform="translate(498.8852459016382,333.1333333333334)" y="0.32em">observation ends, 55.0 Bscf</text></g></g><line stroke="#8a8981" y2="538" x2="972" y1="538" x1="28" /><text font-variant-numeric="tabular-nums" text-anchor="start" fill="#5b646d" font-weight="400" font-family="-apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, Roboto, &quot;Helvetica Neue&quot;, Arial,
    &quot;Noto Sans&quot;, sans-serif, &quot;Apple Color Emoji&quot;, &quot;Segoe UI Emoji&quot;" font-size="13px" y="550" x="28">These are residuals, not uncertainty bars. They carry no confidence statement of any kind: they are the exact arithmetic difference between a noise-free</text><text font-variant-numeric="tabular-nums" text-anchor="start" fill="#5b646d" font-weight="400" font-family="-apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, Roboto, &quot;Helvetica Neue&quot;, Arial,
    &quot;Noto Sans&quot;, sans-serif, &quot;Apple Color Emoji&quot;, &quot;Segoe UI Emoji&quot;" font-size="13px" y="568" x="28">synthetic observation and the straight line fitted through it.</text><text font-variant-numeric="tabular-nums" text-anchor="start" fill="#5b646d" font-weight="400" font-family="-apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, Roboto, &quot;Helvetica Neue&quot;, Arial,
    &quot;Noto Sans&quot;, sans-serif, &quot;Apple Color Emoji&quot;, &quot;Segoe UI Emoji&quot;" font-size="13px" y="592" x="28">Noise-free. Real data adds measurement error on top of this structure. Nothing is smoothed; the line joins consecutive observations because the</text><text font-variant-numeric="tabular-nums" text-anchor="start" fill="#5b646d" font-weight="400" font-family="-apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, Roboto, &quot;Helvetica Neue&quot;, Arial,
    &quot;Noto Sans&quot;, sans-serif, &quot;Apple Color Emoji&quot;, &quot;Segoe UI Emoji&quot;" font-size="13px" y="610" x="28">sequence is the signal.</text><text font-variant-numeric="tabular-nums" text-anchor="start" fill="#5b646d" font-weight="400" font-family="-apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, Roboto, &quot;Helvetica Neue&quot;, Arial,
    &quot;Noto Sans&quot;, sans-serif, &quot;Apple Color Emoji&quot;, &quot;Segoe UI Emoji&quot;" font-size="13px" y="634" x="28">The 10 to 50 psi band is the case author's engineering judgement about volume-averaged reservoir pressure accuracy, not a retrieved figure, and it is the</text><text font-variant-numeric="tabular-nums" text-anchor="start" fill="#5b646d" font-weight="400" font-family="-apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, Roboto, &quot;Helvetica Neue&quot;, Arial,
    &quot;Noto Sans&quot;, sans-serif, &quot;Apple Color Emoji&quot;, &quot;Segoe UI Emoji&quot;" font-size="13px" y="652" x="28">single load-bearing premise of the detectability conclusion: if the real band is 1 to 5 psi, that conclusion reverses.</text><text font-variant-numeric="tabular-nums" text-anchor="start" fill="#5b646d" font-weight="400" font-family="-apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, Roboto, &quot;Helvetica Neue&quot;, Arial,
    &quot;Noto Sans&quot;, sans-serif, &quot;Apple Color Emoji&quot;, &quot;Segoe UI Emoji&quot;" font-size="13px" y="676" x="28">Synthetic. Generator and estimator are separate modules. Known inventory is evaluation-only information that no field measurement provides.</text><text font-variant-numeric="tabular-nums" text-anchor="start" fill="#5b646d" font-weight="400" font-family="-apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, Roboto, &quot;Helvetica Neue&quot;, Arial,
    &quot;Noto Sans&quot;, sans-serif, &quot;Apple Color Emoji&quot;, &quot;Segoe UI Emoji&quot;" font-size="13px" y="700" x="28">Standard conditions: SPE / one standard atmosphere, 14.6959 psia, 60 degF, Z_sc = 1. Pressure is absolute (psia).</text></svg>
